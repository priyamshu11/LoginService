

# Application Info
spring.application.name=loginservice

# Server Configuration
server.port=8080

# Database Configuration (example using MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/login_db
spring.datasource.username=root
spring.datasource.password=pass@word1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.org.springframework=INFO
logging.level.com.yourcompany.loginservice=DEBUG

# Security (if using Spring Security)
spring.security.user.name=admin
spring.security.user.password=admin123

# Actuator (for monitoring)
management.endpoints.web.exposure.include=*

